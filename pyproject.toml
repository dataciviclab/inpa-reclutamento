[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-inpa-reclutamento"
version = "0.1.0"
description = "Dati aperti sul reclutamento della PA dal Portale inPA"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "duckdb>=1.5.3,<2",
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
scripts = [
    "requests>=2.28",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/inpa-reclutamento"

[tool.toolkit.extends]
source_id = "inpa_reclutamento"

[tool.pytest.ini_options]
markers = [
    "contract: contratti pubblici (dataset.yml, parquet schema)",
    "regression: regressioni già verificate",
]
