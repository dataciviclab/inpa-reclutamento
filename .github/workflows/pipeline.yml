name: Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'compose/**'
      - 'scripts/**'
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      is_schedule: ${{ steps.detect.outputs.is_schedule }}
      is_monthly: ${{ steps.detect.outputs.is_monthly }}
    steps:
      - uses: actions/checkout@v7
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_schedule=true" >> $GITHUB_OUTPUT
          else
            echo "is_schedule=false" >> $GITHUB_OUTPUT
          fi

          if [ "${{ github.event.schedule }}" = "0 6 1 * *" ]; then
            echo "is_monthly=true" >> $GITHUB_OUTPUT
          else
            echo "is_monthly=false" >> $GITHUB_OUTPUT
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E "^datasets/|^compose/" | cut -d'/' -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          else
            echo "changed=" >> $GITHUB_OUTPUT
          fi

  pipeline:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python setup
        uses: dataciviclab/.github/actions/python-setup@main

      - name: Install dependencies
        run: pip install -e ".[pipeline]"

      - name: Source health check
        if: needs.detect.outputs.is_schedule == 'true'
        run: make health-check

      - name: Run bandi open (daily)
        run: make run-bandi-open
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: 1

      - name: Run bandi closed (monthly only)
        if: needs.detect.outputs.is_monthly == 'true'
        run: make run-bandi-closed
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: 1

      - name: Run comunicazioni
        run: make run-comunicazioni
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: 1

      - name: Run compose
        run: make run-compose
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: 1

      - name: GCS auth (WIF)
        uses: google-github-actions/auth@v3
        id: gcp-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: GCS auth
        uses: dataciviclab/.github/actions/gcs-auth@main

      - name: Sync to GCS
        if: steps.gcs.outputs.ready == 'true'
        run: |
          gsutil -m rsync -r -x '_run/|_validate/|metadata.json' out/data/clean/ gs://dataciviclab-clean/inpa-reclutamento/
          gsutil -m rsync -r -x '_run/|_validate/|metadata.json' out/data/mart/ gs://dataciviclab-mart/inpa-reclutamento/

      - name: Registry update PR
        uses: dataciviclab/.github/actions/registry-update-pr@main
        with:
          repo-slug: inpa-reclutamento
