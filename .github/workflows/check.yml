name: check

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "datasets/**"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.sql"
      - "**/Makefile"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
      - run: pip install ruff
      - run: ruff check .

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
      - run: make check

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
      - run: python -m py_compile dashboard/app.py
