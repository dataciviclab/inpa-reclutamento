name: Pipeline (monthly)

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: pipeline-monthly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: inpa-reclutamento
      run-command: "make run"
      python-extra-packages: "-e .[pipeline]"
      extra-env: "TOOLKIT_ALLOW_SCRIPT_SOURCE=1"
    permissions:
      contents: write
      id-token: write
    secrets: inherit
