name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "dev,pipeline"

      - uses: dataciviclab/.github/.github/actions/python-ci@main

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extras: "dashboard"

      - name: Dashboard smoke test
        run: python -m py_compile dashboard/app.py
