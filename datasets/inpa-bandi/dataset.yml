# Bandi e avvisi nel Portale inPA (Portale del Reclutamento PA)
# Fonte: API pubblica non documentata https://portale.inpa.gov.it/concorsi-smart/api/

root: "../../out"
schema_version: 1

dataset:
  name: "inpa_bandi"
  description: "Bandi e avvisi del Portale inPA — concorsi, mobilità e selezioni della PA"
  source_id: "inpa_reclutamento"
  tags: [pa, concorsi, reclutamento, lavoro]
  category: pa
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "inpa_open"
      type: "script"
      client:
        timeout: 300
      args:
        command: "python ../../scripts/harvest_bandi.py raw_input.csv --status OPEN"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true
    - name: "inpa_closed"
      type: "script"
      client:
        timeout: 1200
      args:
        command: "python ../../scripts/harvest_bandi.py raw_input_closed.csv --status CLOSED"
        output: "raw_input_closed.csv"
        filename: "raw_input_closed.csv"

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    delim: ","
    encoding: "utf-8"
  required_columns: [id, codice, titolo, figura_ricercata, data_pubblicazione, data_scadenza, num_posti, is_graduatoria, tipo_procedura, categoria, settore, regione, provincia, ente, status, status_label, salary_min, salary_max, link_inpa]
  validate:
    not_null: [id, titolo]
    primary_key: [id]
    min_rows: 500

mart:
  tables:
    - name: "mart_trend_anno"
      sql: "sql/mart_trend_anno.sql"
    - name: "mart_scadenze_calendario"
      sql: "sql/mart_scadenze_calendario.sql"
    - name: "mart_efficienza_ente"
      sql: "sql/mart_efficienza_ente.sql"
    - name: "mart_profili_ricercati"
      sql: "sql/mart_profili_ricercati.sql"
    - name: "mart_geografia_bandi"
      sql: "sql/mart_geografia_bandi.sql"
    - name: "mart_stipendi"
      sql: "sql/mart_stipendi.sql"
  required_tables:
    - "mart_trend_anno"
    - "mart_scadenze_calendario"
    - "mart_efficienza_ente"
    - "mart_profili_ricercati"
    - "mart_geografia_bandi"
    - "mart_stipendi"
  validate:
    table_rules:
      mart_trend_anno:
        required_columns: [anno, num_bandi, posti_totali, enti_distinti]
        primary_key: [anno]
        min_rows: 1
      mart_scadenze_calendario:
        required_columns: [data_scadenza, num_bandi, posti_totali, enti_diversi, categorie]
        primary_key: [data_scadenza]
        min_rows: 1
      mart_efficienza_ente:
        required_columns: [ente, totale_bandi, totale_posti, media_posti_per_bando]
        primary_key: [ente]
        min_rows: 1
      mart_profili_ricercati:
        required_columns: [profilo, n_bandi, posti_totali, enti_diversi]
        primary_key: [profilo]
        min_rows: 1
      mart_geografia_bandi:
        required_columns: [regione, n_bandi, posti_totali, enti_diversi]
        primary_key: [regione]
        min_rows: 1
      mart_stipendi:
        required_columns: [ente, titolo, salary_min, salary_max]
        min_rows: 1

validation:
  fail_on_error: true
