# Bandi chiusi nel Portale inPA (aggiornamento mensile)
# Fonte: API pubblica non documentata https://portale.inpa.gov.it/concorsi-smart/api/

root: "../../out"
schema_version: 1

dataset:
  name: "inpa_bandi_closed"
  description: "Bandi chiusi del Portale inPA — archivio storico concorsi"
  source_id: "inpa_reclutamento"
  tags: [pa, concorsi, reclutamento, lavoro, archivio]
  category: pa
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "inpa_closed"
      type: "script"
      client:
        timeout: 1200
      args:
        command: "python ../../scripts/harvest_bandi.py raw_input.csv --status CLOSED"
        output: "raw_input.csv"
        filename: "raw_input.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    delim: ","
    encoding: "utf-8"
  required_columns: [id, codice, titolo, figura_ricercata, data_pubblicazione, data_scadenza, num_posti, is_graduatoria, tipo_procedura, categoria, settore, regione, provincia, ente, status, status_label, salary_min, salary_max, link_inpa]
  validate:
    not_null: [id, titolo]
    primary_key: [id]
    min_rows: 10000

mart:
  tables:
    - name: "mart_trend_anno"
      sql: "sql/mart_trend_anno.sql"
  required_tables:
    - "mart_trend_anno"
  validate:
    table_rules:
      mart_trend_anno:
        required_columns: [anno, num_bandi, posti_totali, enti_distinti]
        primary_key: [anno]
        min_rows: 1

validation:
  fail_on_error: true
