# Compose inPA: analisi cross-dataset bandi × comunicazioni
# Unisce inpa-bandi-closed e inpa-comunicazioni per metriche di trasparenza e tempi.

root: "../../out"
schema_version: 1

dataset:
  name: "inpa_insight"
  source_id: "inpa_reclutamento"
  tags: [pa, concorsi, reclutamento, trasparenza, compose]
  category: pa
  years: [2026]

raw:
  output_policy: overwrite
  sources:
    - name: "bandi_closed"
      type: local_file
      args:
        path: "../../out/data/clean/inpa_bandi_closed/2026/inpa_bandi_closed_2026_clean.parquet"
        filename: "bandi_closed.parquet"
      primary: true

support:
  - name: bandi
    config: "../../datasets/inpa-bandi-closed/dataset.yml"
    years: [2026]
  - name: com
    config: "../../datasets/inpa-comunicazioni/dataset.yml"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest

mart:
  tables:
    - name: "mart_tempi_per_ente"
      sql: "sql/mart_tempi_per_ente.sql"
    - name: "mart_trasparenza_ente"
      sql: "sql/mart_trasparenza_ente.sql"
    - name: "mart_tempi_per_procedura"
      sql: "sql/mart_tempi_per_procedura.sql"
  required_tables:
    - "mart_tempi_per_ente"
    - "mart_trasparenza_ente"
    - "mart_tempi_per_procedura"
  validate:
    table_rules:
      mart_tempi_per_ente:
        required_columns: [ente, n_bandi_con_comunicazioni, mediana_giorni]
        primary_key: [ente]
        min_rows: 1
      mart_trasparenza_ente:
        required_columns: [ente, totale_bandi_chiusi, pct_trasparenza]
        primary_key: [ente]
        min_rows: 0
      mart_tempi_per_procedura:
        required_columns: [tipo_procedura, n_bandi_totali, n_con_comunicazioni, mediana_gg]
        primary_key: [tipo_procedura]
        min_rows: 1

validation:
  fail_on_error: true
